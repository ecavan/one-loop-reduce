name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SYMBOLICA_HIDE_BANNER: 1

jobs:
  check:
    # The `symbolica` GitHub Environment holds the SYMBOLICA_LICENSE secret.
    # See README.md ("Continuous integration") for how to create it.
    environment: symbolica
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `dev` is the branch gammaloop tracks; breaking it should be visible.
        symbolica: [main, dev]
    env:
      SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
    steps:
      - uses: actions/checkout@v4

      - name: Require a Symbolica license
        # Without a key Symbolica runs restricted -- one instance, aborting the
        # moment it is touched from a second thread. The suite still passes, so
        # a missing secret would silently weaken CI rather than break it.
        run: |
          if [ -z "$SYMBOLICA_LICENSE" ]; then
            echo "::error::SYMBOLICA_LICENSE is empty. Set it as a secret on the 'symbolica' environment (Settings > Environments > symbolica > Add secret). The name matters: Symbolica reads SYMBOLICA_LICENSE, not SYMBOLICA_LICENSE_KEY."
            exit 1
          fi

      - name: Patch symbolica to ${{ matrix.symbolica }}
        run: sed -i 's|branch = "main"|branch = "${{ matrix.symbolica }}"|' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.symbolica }}

      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Symbolica aborts across threads without a license, and the test binaries
      # share one process, so the suite is single-threaded by contract.
      - run: cargo test --workspace -- --test-threads=1
