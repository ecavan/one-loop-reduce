name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SYMBOLICA_HIDE_BANNER: 1

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: one-loop-reduce
    env:
      SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: one-loop-reduce
      - name: Check out native master Symbols and numerical hooks
        uses: actions/checkout@v4
        with:
          repository: alphal00p/oneloopmaster
          path: oneloopmaster
      - name: Check out shared Feynkit integral families
        uses: actions/checkout@v4
        with:
          repository: alphal00p/gammaloop
          # Set this repository variable to the published shared-family change.
          # Until it is published, the local sibling worktree is required.
          ref: ${{ vars.FEYNKIT_REF || 'main' }}
          path: gammaloop/feynkit-rich-display
      - name: Require the shared-family extraction API
        run: |
          source_file=../gammaloop/feynkit-rich-display/crates/feynkit-graph/src/integrals.rs
          if ! test -f "$source_file" || ! rg -q 'pub fn quadratic_denominator' "$source_file"; then
            echo '::error::FEYNKIT_REF must contain the shared IntegralFamily quadratic_denominator API. The integration currently requires the coordinated local Feynkit changes described in README.md.'
            exit 1
          fi

      - name: Report Symbolica licensing mode
        # Restricted mode is the supported default: the whole suite is
        # single-threaded by contract, so it passes with or without a key.
        # Never fail here -- just say in the log which mode ran.
        run: |
          if [ -n "$SYMBOLICA_LICENSE" ]; then
            echo "::notice title=Symbolica::Licensed run (SYMBOLICA_LICENSE is set)."
          else
            echo "::notice title=Symbolica::Restricted run (no SYMBOLICA_LICENSE secret): one instance, one thread. Expected to pass -- the suite is single-threaded. Set a repository secret named SYMBOLICA_LICENSE to run licensed."
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: one-loop-reduce -> target
          key: symbolica-a19c760

      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Restricted Symbolica aborts when touched from a second thread, and the
      # test binaries share one process, so the suite is single-threaded.
      - run: cargo test --workspace -- --test-threads=1
