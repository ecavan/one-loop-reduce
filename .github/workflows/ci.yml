name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SYMBOLICA_HIDE_BANNER: 1

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `dev` is the branch gammaloop tracks; breaking it should be visible.
        symbolica: [main, dev]
    env:
      SYMBOLICA_LICENSE: ${{ secrets.SYMBOLICA_LICENSE }}
    steps:
      - uses: actions/checkout@v4

      - name: Report Symbolica licensing mode
        # Restricted mode is the supported default: the whole suite is
        # single-threaded by contract, so it passes with or without a key.
        # Never fail here -- just say in the log which mode ran.
        run: |
          if [ -n "$SYMBOLICA_LICENSE" ]; then
            echo "::notice title=Symbolica::Licensed run (SYMBOLICA_LICENSE is set)."
          else
            echo "::notice title=Symbolica::Restricted run (no SYMBOLICA_LICENSE secret): one instance, one thread. Expected to pass -- the suite is single-threaded. Set a repository secret named SYMBOLICA_LICENSE to run licensed."
          fi

      - name: Patch symbolica to ${{ matrix.symbolica }}
        run: sed -i 's|branch = "main"|branch = "${{ matrix.symbolica }}"|' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.symbolica }}

      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Restricted Symbolica aborts when touched from a second thread, and the
      # test binaries share one process, so the suite is single-threaded.
      - run: cargo test --workspace -- --test-threads=1
