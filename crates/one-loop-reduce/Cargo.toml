[package]
name = "one-loop-reduce"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One-loop IBP reduction of Feynman integrals to the scalar master integrals"

[lib]
name = "oneloopreduce"

[dependencies]
# Must stay a crates.io version requirement -- see the note in the workspace
# root Cargo.toml.
#
# Symbolica's *default* features are taken deliberately. `default-features =
# false` does not build: symbolica declares `numerica = { default-features =
# false }`, so dropping symbolica's defaults leaves numerica with neither an
# integer nor a float backend and it fails to compile. Naming a backend
# explicitly is not portable either -- the two sources spell them differently:
#
#   crates.io symbolica 2.2.0 : `gmp` / `no_gmp`
#   git symbolica-dev/symbolica@main (also 2.2.0) : `integer-gmp` /
#       `integer-malachite` / `float-mpfr` / `float-astro`
#
# so any explicit backend feature breaks against one of the two. The default
# set resolves correctly against both, and it is what upstream
# symbolica-community and its `example_extension` template use.
symbolica = "2.2"
thiserror = "2.0"

# Benchmark / validation harnesses -- not part of the library. Sources live under
# benchmarks/rust/; run with e.g.
# `cargo run -p one-loop-reduce --example golden_master`.
# See benchmarks/README.md and docs/06-validation.md.
[[example]]
name = "bench"
path = "benchmarks/rust/bench.rs"

[[example]]
name = "golden_master"
path = "benchmarks/rust/golden_master.rs"

[[example]]
name = "emit_reductions"
path = "benchmarks/rust/emit_reductions.rs"

[[example]]
name = "ggh_formfactor"
path = "benchmarks/rust/ggh_formfactor.rs"

[[example]]
name = "wloop_reduce"
path = "benchmarks/rust/wloop_reduce.rs"

[[example]]
name = "box_reduce"
path = "benchmarks/rust/box_reduce.rs"

[[example]]
name = "time_reduce"
path = "benchmarks/rust/time_reduce.rs"

[[example]]
name = "frontier_map"
path = "benchmarks/rust/frontier_map.rs"

[[example]]
name = "massless_legs"
path = "benchmarks/rust/massless_legs.rs"


